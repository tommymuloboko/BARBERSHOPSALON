# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this repo on Render → New → Blueprint, then set the secret env vars.
services:
  - type: web
    name: maestro-pos-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/reports/daily
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JPA_DDL_AUTO
        value: update
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75
      - key: SPRING_DATASOURCE_URL
        sync: false   # set in Render dashboard: jdbc:postgresql://...neon.tech/db?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # e.g. https://your-app.vercel.app
